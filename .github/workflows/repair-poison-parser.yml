name: Repair poison parser patch

on:
  push:
    branches: [fix/poison-procs]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore unrelated parser lines and remove helper workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/parser.js')
          s = p.read_text()
          s = s.replace(
              r"const HEAL_RE = /^(.+?) healed (.+?)( over time)? for (\\d+)(?: \\((\\d+))? hit points?(?: by (.+?))?\\.(?: \\(([A-Za-z][A-Za-z ]*)\\))?$/",
              r"const HEAL_RE = /^(.+?) healed (.+?)( over time)? for (\\d+)(?: \\((\\d+)\\))? hit points?(?: by (.+?))?\\.(?: \\(([A-Za-z][A-Za-z ]*)\\))?$/"
          )
          s = s.replace(
              r"    ') -- (.+?)\\s*\\(Lvl: (\\d+)\\)$'",
              r"    ') -- (.+?)\\s*\\(Lvl: (\\d+)\\)$'"
          )
          p.write_text(s)
          PY
          git rm .github/workflows/repair-poison-parser.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parser.js
          git commit -m "Normalize poison parser patch"
          git add -u .github/workflows/repair-poison-parser.yml || true
          git push
