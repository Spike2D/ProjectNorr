name: Restore parser regex escaping

on:
  push:
    branches: [fix/poison-procs]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore main parser regexes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/parser.js')
          s = p.read_text()
          bad_heal = r"const HEAL_RE = /^(.+?) healed (.+?)( over time)? for (\d+)(?: \((\d+))? hit points?(?: by (.+?))?\.(?: \(([A-Za-z][A-Za-z ]*)\))?$/"
          good_heal = r"const HEAL_RE = /^(.+?) healed (.+?)( over time)? for (\d+)(?: \((\d+)\))? hit points?(?: by (.+?))?\.(?: \(([A-Za-z][A-Za-z ]*)\))?$/"
          bad_consider = r"    ') -- (.+?)\s*\(Lvl: (\d+)\)$'"
          good_consider = r"    ') -- (.+?)\\s*\\(Lvl: (\\d+)\\)$'"
          if bad_heal not in s:
              raise SystemExit('bad HEAL_RE text not found')
          if bad_consider not in s:
              raise SystemExit('bad CONSIDER_RE text not found')
          s = s.replace(bad_heal, good_heal, 1)
          s = s.replace(bad_consider, good_consider, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/repair-poison-parser.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parser.js
          git commit -m "Restore parser regex escaping"
          git push
