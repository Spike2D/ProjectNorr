name: Fix poison proc parser
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-poison-proc.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/parser.js')
          s = p.read_text()

          old = """const POISON_PROCS = [
  { suffix: 'is poisoned.', strikes: ['Strike'], effect: 'poison' },
]
const POISON_PROC_BY_LAST_WORD = new Map()
for (const p of POISON_PROCS) {
  const w = p.suffix.slice(p.suffix.lastIndexOf(' ') + 1)
  const list = POISON_PROC_BY_LAST_WORD.get(w)
  if (list) list.push(p)
  else POISON_PROC_BY_LAST_WORD.set(w, [p])
}
"""
          if old not in s:
              raise SystemExit('poison proc registry not found')
          s = s.replace(old, '', 1)

          old = """  function classifyPoisonProc(c) {
    if (!c.text.includes('is poisoned.')) return null
    const m = /^(.+?) is poisoned\\.$/.exec(c.text)
    if (!m) return null
    const target = norm(m[1])
    const procs = POISON_PROC_BY_LAST_WORD.get('poisoned.') || []
    const strikeOnly = procs.every(p => p.strikes.includes('Strike'))
    const wasStrike = strikeOnly
    const isStrike = wasStrike
    return { kind: 'poisonProc', seq: c.seq, ts: c.ts, raw: c.raw, target, isStrike, wasStrike, effect: 'poison' }
  },"""
          new = """  function classifyPoisonProc(c) {
    const m = /^(.+?) is poisoned\\.$/.exec(c.text)
    if (!m) return null
    return {
      kind: 'proc',
      seq: c.seq,
      ts: c.ts,
      raw: c.raw,
      target: norm(m[1]),
      effect: 'poison',
      name: 'Poison',
    }
  },"""
          if old not in s:
              raise SystemExit('poison proc classifier not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Test parser
        run: node src/parser.test.js
      - name: Commit parser fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/parser.js
          git rm .github/workflows/fix-poison-proc.yml
          git commit -m 'fix(parser): classify poison procs without fake strike metadata'
          git push
